{{- if and .Values.profiles.portal.enabled .Values.federation.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "neurobagel.componentFullname" (list . "federation") }}
  labels:
    {{- include "neurobagel.componentLabels" (list . "federation") | nindent 4 }}
spec:
  replicas: {{ .Values.federation.replicas }}
  selector:
    matchLabels:
      {{- include "neurobagel.componentSelectorLabels" (list . "federation") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "neurobagel.componentSelectorLabels" (list . "federation") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "neurobagel.serviceAccountName" . }}
      containers:
        - name: federation
          image: "{{ .Values.federation.image.repository }}:{{ .Values.federation.image.tag }}"
          imagePullPolicy: {{ .Values.federation.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: NB_API_PORT
              value: {{ .Values.federation.env.NB_API_PORT | quote }}
            - name: NB_FAPI_BASE_PATH
              value: {{ .Values.federation.env.NB_FAPI_BASE_PATH | quote }}
            - name: NB_FEDERATE_REMOTE_PUBLIC_NODES
              value: {{ .Values.federation.env.NB_FEDERATE_REMOTE_PUBLIC_NODES | quote }}
            - name: NB_ENABLE_AUTH
              value: {{ .Values.global.enableAuth | quote }}
            - name: NB_QUERY_CLIENT_ID
              value: {{ .Values.global.queryClientId | quote }}
            {{- if and (eq .Values.mode "prod") .Values.routing.proxy.enabled }}
            - name: VIRTUAL_HOST
              value: {{ .Values.routing.hosts.fapi | quote }}
            - name: VIRTUAL_PATH
              value: {{ .Values.routing.basePaths.fapi | quote }}
            - name: VIRTUAL_PORT
              value: "8000"
            - name: LETSENCRYPT_HOST
              value: {{ .Values.routing.hosts.fapi | quote }}
            {{- end }}
          volumeMounts:
            - name: local-nodes
              mountPath: /usr/src/local_nb_nodes.json
              subPath: local_nb_nodes.json
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.federation.resources | nindent 12 }}
      volumes:
        - name: local-nodes
          configMap:
            name: {{ include "neurobagel.componentFullname" (list . "local-nodes") }}
{{- end }}
