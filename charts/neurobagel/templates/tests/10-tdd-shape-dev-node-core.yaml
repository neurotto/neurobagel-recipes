{{- if and .Values.tests.enabled .Values.profiles.node.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "neurobagel.componentFullname" (list . "tdd-shape-dev-node-core") }}
  labels:
    {{- include "neurobagel.componentLabels" (list . "tests") | nindent 4 }}
    tests.neurobagel.io/category: tdd-shape
    tests.neurobagel.io/scenario: dev-node
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: {{ .Values.tests.hookDeletePolicy | quote }}
spec:
  serviceAccountName: {{ include "neurobagel.componentFullname" (list . "tests") }}
  restartPolicy: Never
  containers:
    - name: kubectl
      image: {{ .Values.tests.kubectlImage }}
      command:
        - /bin/sh
        - -ec
        - |
          kubectl get statefulset {{ include "neurobagel.componentFullname" (list . "graph") }}
          kubectl get service {{ include "neurobagel.componentFullname" (list . "graph") }}
          kubectl get deployment {{ include "neurobagel.componentFullname" (list . "api") }}
          kubectl get service {{ include "neurobagel.componentFullname" (list . "api") }}
          {{- if eq .Values.storage.neurobagelData.type "pvc" }}
          kubectl get pvc {{ include "neurobagel.componentFullname" (list . "data") }}
          {{- else }}
          kubectl get statefulset {{ include "neurobagel.componentFullname" (list . "graph") }} -o jsonpath='{.spec.template.spec.volumes[?(@.name=="neurobagel-data")].hostPath.path}' | grep -q .
          {{- end }}
{{- end }}
