{{- if and .Values.tests.enabled .Values.profiles.node.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "neurobagel.componentFullname" (list . "tdd-config-node-contracts") }}
  labels:
    {{- include "neurobagel.componentLabels" (list . "tests") | nindent 4 }}
    tests.neurobagel.io/category: tdd-config
    tests.neurobagel.io/scenario: node-contracts
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: {{ .Values.tests.hookDeletePolicy | quote }}
spec:
  serviceAccountName: {{ include "neurobagel.componentFullname" (list . "tests") }}
  restartPolicy: Never
  containers:
    - name: kubectl
      image: {{ .Values.tests.kubectlImage }}
      command:
        - /bin/sh
        - -ec
        - |
          kubectl get configmap {{ include "neurobagel.componentFullname" (list . "scripts") }}
          kubectl get configmap {{ include "neurobagel.componentFullname" (list . "vocab") }}
          {{- if eq .Values.storage.graphdbHome.type "pvc" }}
          kubectl get pvc {{ include "neurobagel.componentFullname" (list . "graphdb-home") }}
          {{- else }}
          kubectl get statefulset {{ include "neurobagel.componentFullname" (list . "graph") }} -o jsonpath='{.spec.template.spec.volumes[?(@.name=="graphdb-home")].hostPath.path}' | grep -q .
          {{- end }}
          {{- if eq .Values.storage.neurobagelData.type "pvc" }}
          kubectl get pvc {{ include "neurobagel.componentFullname" (list . "data") }}
          {{- else }}
          kubectl get statefulset {{ include "neurobagel.componentFullname" (list . "graph") }} -o jsonpath='{.spec.template.spec.volumes[?(@.name=="neurobagel-data")].hostPath.path}' | grep -q .
          {{- end }}
          kubectl get secret {{ include "neurobagel.secretName" . }}
{{- end }}
