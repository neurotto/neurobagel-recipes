{{- if .Values.tests.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "neurobagel.componentFullname" (list . "tests") }}
  labels:
    {{- include "neurobagel.componentLabels" (list . "tests") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "neurobagel.componentFullname" (list . "tests") }}
  labels:
    {{- include "neurobagel.componentLabels" (list . "tests") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["services", "pods", "configmaps", "secrets", "persistentvolumeclaims"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "neurobagel.componentFullname" (list . "tests") }}
  labels:
    {{- include "neurobagel.componentLabels" (list . "tests") | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "neurobagel.componentFullname" (list . "tests") }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "neurobagel.componentFullname" (list . "tests") }}
{{- end }}
