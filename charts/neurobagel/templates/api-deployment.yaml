{{- if and .Values.profiles.node.enabled .Values.api.enabled }}
{{- if or (not .Values.initData.enabled) (not .Values.initData.inputData.hostPath.enabled) (eq .Values.initData.inputData.hostPath.path "") }}
{{- fail "node API requires initData.enabled=true with hostPath input data configured" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "neurobagel.componentFullname" (list . "api") }}
  labels:
    {{- include "neurobagel.componentLabels" (list . "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "neurobagel.componentSelectorLabels" (list . "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "neurobagel.componentSelectorLabels" (list . "api") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "neurobagel.serviceAccountName" . }}
      {{- if and .Values.initData.enabled .Values.initData.inputData.hostPath.enabled (ne .Values.initData.inputData.hostPath.path "") }}
      initContainers:
        - name: wait-for-datasets
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              i=0
              while [ ! -s /data/datasets_metadata.json ]; do
                i=$((i+1))
                if [ "$i" -ge 180 ]; then
                  echo "datasets_metadata.json was not created by init_data"
                  exit 1
                fi
                sleep 2
              done
          volumeMounts:
            - name: neurobagel-data
              mountPath: /data
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command:
            - /bin/bash
            - /usr/src/api_entrypoint.sh
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: NB_GRAPH_USERNAME
              value: {{ .Values.graph.env.NB_GRAPH_USERNAME | quote }}
            - name: NB_GRAPH_ADDRESS
              value: {{ include "neurobagel.componentFullname" (list . "graph") | quote }}
            - name: NB_GRAPH_PORT
              value: {{ .Values.graph.env.NB_GRAPH_PORT | quote }}
            - name: NB_GRAPH_DB
              value: {{ .Values.api.env.NB_GRAPH_DB | quote }}
            - name: NB_DATASETS_METADATA_PATH
              value: /data/datasets_metadata.json
            - name: NB_RETURN_AGG
              value: {{ .Values.api.env.NB_RETURN_AGG | quote }}
            - name: NB_MIN_CELL_SIZE
              value: {{ .Values.api.env.NB_MIN_CELL_SIZE | quote }}
            - name: NB_API_PORT
              value: {{ .Values.api.env.NB_API_PORT | quote }}
            - name: NB_NAPI_BASE_PATH
              value: {{ .Values.api.env.NB_NAPI_BASE_PATH | quote }}
            - name: NB_API_ALLOWED_ORIGINS
              value: {{ .Values.api.env.NB_API_ALLOWED_ORIGINS | quote }}
            - name: NB_ENABLE_AUTH
              value: {{ .Values.global.enableAuth | quote }}
            - name: NB_QUERY_CLIENT_ID
              value: {{ .Values.global.queryClientId | quote }}
            - name: NB_CONFIG
              value: {{ .Values.api.env.NB_CONFIG | quote }}
            - name: NB_CATALOG_MODE
              value: {{ .Values.api.env.NB_CATALOG_MODE | quote }}
            {{- if and (eq .Values.mode "prod") .Values.routing.proxy.enabled }}
            - name: VIRTUAL_HOST
              value: {{ .Values.routing.hosts.napi | quote }}
            - name: VIRTUAL_PATH
              value: {{ .Values.routing.basePaths.napi | quote }}
            - name: VIRTUAL_PORT
              value: "8000"
            - name: LETSENCRYPT_HOST
              value: {{ .Values.routing.hosts.napi | quote }}
            {{- end }}
          volumeMounts:
            - name: scripts
              mountPath: /usr/src/api_entrypoint.sh
              subPath: api_entrypoint.sh
            - name: neurobagel-data
              mountPath: /data
            - name: graph-secrets
              mountPath: /run/secrets
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: scripts
          configMap:
            name: {{ include "neurobagel.componentFullname" (list . "scripts") }}
            defaultMode: 0755
        - name: neurobagel-data
          {{- if eq .Values.storage.neurobagelData.type "pvc" }}
          persistentVolumeClaim:
            claimName: {{ include "neurobagel.componentFullname" (list . "data") }}
          {{- else if eq .Values.storage.neurobagelData.type "hostPath" }}
          hostPath:
            path: {{ .Values.storage.neurobagelData.hostPath.path }}
            type: {{ .Values.storage.neurobagelData.hostPath.type }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: graph-secrets
          secret:
            secretName: {{ include "neurobagel.secretName" . }}
            items:
              - key: {{ .Values.secrets.keys.user }}
                path: db_user_password
{{- end }}
